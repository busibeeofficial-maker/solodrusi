<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Появление колоса — варианты</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">
<style>
  body{background:var(--bg)}
  .demo{padding:clamp(1.2rem,3vw,2.4rem) 0}
  .demo h1{font-size:clamp(1.3rem,1.1rem + .8vw,1.8rem)}
  .demo__sub{margin:.3rem 0 1.2rem;font-size:.86rem;color:var(--muted)}
  .sw{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1.6rem}
  .sw button{font:inherit;font-size:.84rem;padding:.55rem 1rem;border-radius:999px;cursor:pointer;
    background:transparent;color:var(--green);border:1px solid var(--field-line);min-height:44px}
  .sw button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
  .sw .go{background:var(--amber-btn);color:#fff;border-color:var(--amber-btn);font-weight:600}
  .st{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:clamp(1.2rem,3vw,2.6rem);align-items:center}
  .st__note{font-size:.88rem;line-height:1.6;color:var(--muted);max-width:46ch}
  .st__note b{color:var(--green)}
  #earsvg{overflow:visible}
  .beam{fill:none}

  /* ---------- общее ---------- */
  .earwrap{transform-box:view-box}
  .v .ear,.v .earwrap,.v .lf > path,.v .awns{transition:none}

  /* ===== A. РОСТ ИЗ ЗЕМЛИ ===== */
  .v-grow .earwrap{transform-origin:300px 700px;animation:gw 1.5s cubic-bezier(.16,.9,.28,1) both}
  .v-grow .lf > path{transform-box:fill-box;transform-origin:50% 100%;
    animation:leafOpen .62s cubic-bezier(.22,1.4,.5,1) both;
    animation-delay:calc(.55s + var(--k,0) * .045s)}
  .v-grow .awns{transform-box:view-box;transform-origin:300px 300px;
    animation:awnOpen .9s cubic-bezier(.22,1,.36,1) both;animation-delay:1.25s}
  @keyframes gw{0%{transform:scaleY(.02) scaleX(.55);opacity:0}
                18%{opacity:1}
                72%{transform:scaleY(1.04) scaleX(1.02)}
                100%{transform:none;opacity:1}}
  @keyframes leafOpen{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
  @keyframes awnOpen{from{transform:scaleY(.3);opacity:0}to{transform:none;opacity:1}}

  /* ===== B. СВЕТОВАЯ ВОЛНА ===== */
  .v-beam .ear{clip-path:url(#wipe)}
  .v-beam .wipe__r{animation:wipeUp 1.6s cubic-bezier(.4,0,.15,1) both}
  .v-beam .beam{fill:url(#bg1);animation:beamUp 1.6s cubic-bezier(.4,0,.15,1) both}
  @keyframes wipeUp{from{y:700px;height:20px}to{y:-60px;height:780px}}
  @keyframes beamUp{0%{y:700px;opacity:0}
                    10%{opacity:.9}
                    88%{opacity:.9}
                    100%{y:-60px;opacity:0}}

  /* ===== C. РАСКРЫТИЕ ===== */
  .v-open .stalk,.v-open .stalk-hi,.v-open .node,.v-open .sheath{
    animation:fadeIn .5s ease-out both}
  .v-open .lf > path{transform-box:fill-box;transform-origin:50% 100%;
    animation:unfold .7s cubic-bezier(.2,1.3,.4,1) both;
    animation-delay:calc(.35s + var(--k,0) * .07s)}
  .v-open .awns{transform-box:view-box;transform-origin:300px 260px;
    animation:splay 1.1s cubic-bezier(.22,1,.36,1) both;animation-delay:1.6s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes unfold{from{transform:rotate(-24deg) scale(.35);opacity:0}
                    to{transform:none;opacity:1}}
  @keyframes splay{from{transform:scaleX(.15) scaleY(.6);opacity:0}to{transform:none;opacity:1}}

  /* ===== D. ИЗ ВЕТРА ===== */
  .v-wind .earwrap{transform-origin:300px 700px;animation:windIn 2.1s cubic-bezier(.18,.9,.3,1) both}
  .v-wind .lf > path{animation:fadeIn .8s ease-out both;animation-delay:calc(var(--k,0) * .03s)}
  @keyframes windIn{
    0%{transform:rotate(-21deg) translateY(26px);opacity:0}
    22%{opacity:1}
    52%{transform:rotate(5.5deg) translateY(0)}
    72%{transform:rotate(-2.4deg)}
    86%{transform:rotate(1deg)}
    100%{transform:none;opacity:1}}

  @media (prefers-reduced-motion:reduce){
    .v-grow .earwrap,.v-wind .earwrap,.v-grow .lf > path,.v-open .lf > path,
    .v-wind .lf > path,.v-grow .awns,.v-open .awns,.v-beam .wipe__r,.v-beam .beam,
    .v-open .stalk,.v-open .stalk-hi,.v-open .node,.v-open .sheath{animation:none}
    .v-beam .ear{clip-path:none}
  }
</style>
</head><body>

    <button type="button" data-v="open" aria-pressed="false">3 — раскрытие</button>
    <button type="button" data-v="wind" aria-pressed="false">4 — из ветра</button>
    <button type="button" class="go" id="replay">Ещё раз</button>

<script>
  var NOTES={
    grow:'<b>Рост из земли.</b> Колос вытягивается снизу от самой земли, чуть перебирает высоту и садится обратно — как растение, которое поднялось. Следом снизу вверх раскрываются чешуйки, последними расходятся ости. Ближе всего к правде: так колос и растёт.',
    beam:'<b>Световая волна.</b> Полоса света идёт снизу вверх и оставляет за собой прорисованный колос. Ничего не двигается — двигается только свет, поэтому вариант самый дешёвый по отрисовке и самый «киношный».',
    open:'<b>Раскрытие.</b> Сначала проявляется стебель, потом чешуйки по одной отгибаются от оси снизу вверх, в конце веером расходятся ости. Самый ботанический и самый долгий — почти три секунды.',
    wind:'<b>Из ветра.</b> Колос входит в кадр сильно наклонённым, будто его прижало порывом, и выпрямляется с затухающим качанием. Сразу связывает появление с фоновым ветром, который на колосе и так живёт.'
  };
  var stage=document.getElementById('stage'), note=document.getElementById('note');
  var cur='grow';
  function play(v){
    cur=v;
    stage.className='v';
    void stage.offsetWidth;
    stage.className='v v-'+v;
    note.innerHTML=NOTES[v];
    document.querySelectorAll('.sw button[data-v]').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.v===v)); });
  }
  document.querySelectorAll('.sw button[data-v]').forEach(function(b){
    b.addEventListener('click',function(){ play(b.dataset.v); });
  });
  document.getElementById('replay').addEventListener('click',function(){ play(cur); });
  play('grow');
</script>
