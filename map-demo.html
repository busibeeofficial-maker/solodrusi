<style>
  body{background:#1E4A3B;color:#EAF0EC}
  .demo{padding:clamp(1.4rem,3vw,2.6rem) 0}
  .demo__head{display:flex;align-items:baseline;gap:1rem 1.6rem;flex-wrap:wrap;margin-bottom:1.4rem}
  .demo__head h1{color:#fff;font-size:clamp(1.3rem,1.1rem + .8vw,1.8rem)}
  .demo__head p{margin:0;font-size:.86rem;color:rgba(234,240,236,.66)}
  .sw{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1.2rem}
  .sw button{font:inherit;font-size:.82rem;padding:.5rem .9rem;border-radius:999px;cursor:pointer;
    background:transparent;color:rgba(234,240,236,.78);border:1px solid rgba(234,240,236,.28)}
  .sw button[aria-pressed="true"]{background:#EAF0EC;color:#1E4A3B;border-color:#EAF0EC;font-weight:600}
  .stage{position:relative;margin:0 0 2.4rem}
  .stage::before{content:"";position:absolute;inset:-8% -4%;pointer-events:none;
    background:radial-gradient(56% 66% at 46% 54%,rgba(233,169,77,.14),transparent 72%)}
  .stage svg{position:relative;width:100%;height:auto;display:block;overflow:visible}
  .cap{margin:.7rem 0 0;font-size:.8rem;color:rgba(234,240,236,.6)}

  .map{fill:none;stroke:#EFC894;stroke-width:1.35;opacity:.85;stroke-linejoin:round;
    vector-effect:non-scaling-stroke}
  .map--isl{stroke-width:1.1;opacity:.6}
  .rt{fill:none;stroke:#EFB35C;stroke-width:1.2;opacity:.42;stroke-dasharray:3.5 5;
    vector-effect:non-scaling-stroke}
  .nd{fill:#F3C87E;opacity:.9}
  .lb{fill:rgba(234,240,236,.62);font:400 7px var(--body);letter-spacing:.02em}
  .stage:not(.is-lab) .lb{display:none}

  /* бегунок: яркий отрезок пробегает по маршруту */
  .flow{fill:none;stroke:#FFEBC2;stroke-width:2.4;stroke-linecap:round;vector-effect:non-scaling-stroke;
    stroke-dasharray:var(--seg,40) var(--rest,3000);stroke-dashoffset:var(--len,3000);opacity:.95}
  .flow--glow{stroke:#F5C877;stroke-width:6;opacity:.22}
  @media (prefers-reduced-motion:no-preference){
    .flow{animation:run var(--dur,7s) linear calc(var(--i,0) * .55s) infinite}
  }
  @keyframes run{to{stroke-dashoffset:calc(var(--len,3000) * -1)}}
</style>

<script>
  // длину пути знает только браузер — раздаём её в переменные,
  // иначе бегунок не попадёт в размер маршрута
  document.querySelectorAll('.flow').forEach(function(p){
    var L=p.getTotalLength();
    var seg=Math.max(34,Math.min(90,L*0.12));
    p.style.setProperty('--len',L.toFixed(1));
    p.style.setProperty('--seg',seg.toFixed(1));
    p.style.setProperty('--rest',(L*2).toFixed(1));
    p.style.setProperty('--dur',(L/52).toFixed(1)+'s');
  });
  var A=document.getElementById('stageA'), B=document.getElementById('stageB');
  document.querySelectorAll('.sw button[data-v]').forEach(function(b){
    b.addEventListener('click',function(){
      var a=b.dataset.v==='a';
      A.hidden=!a; B.hidden=a;
      document.querySelectorAll('.sw button[data-v]').forEach(function(x){
        x.setAttribute('aria-pressed', String(x===b)); });
    });
  });
  var lb=document.querySelector('[data-lab]');
  lb.addEventListener('click',function(){
    var on=lb.getAttribute('aria-pressed')==='false';
    lb.setAttribute('aria-pressed',String(on));
    [A,B].forEach(function(s){ s.classList.toggle('is-lab',on); });
  });
</script>
